# Keeps dependencies current with small, reviewable pull requests (each one is validated by the CI).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /cli
    schedule: { interval: weekly }
    groups:
      go-minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /api
    schedule: { interval: weekly }
    groups:
      npm-minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: docker
    directory: /api
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
