name: Release CLI

# Publishing a release = pushing a tag:   git tag cli/v0.2.0 && git push origin cli/v0.2.0
# Running this workflow by hand only builds and verifies the archives (nothing is published), to try the pipeline safely.
on:
  push:
    tags: ["cli/v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp on the trial build (no v, no cli/)"
        default: "0.0.0-trial"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build all platforms
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes read the history since the previous tag
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: cli/go.sum

      - name: Work out the version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/cli/v* ]]; then v="${GITHUB_REF_NAME#cli/v}"; else v="${{ inputs.version }}"; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then echo "::error::'$v' is not a semantic version (1.2.3 or 1.2.3-rc.1)"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Never ship a broken build
        working-directory: cli
        run: |
          make fmt-check
          go vet ./...
          go test -count=1 ./...

      - name: Build the archives
        working-directory: cli
        run: make dist VERSION="${{ steps.v.outputs.version }}" COMMIT="$(git rev-parse --short HEAD)"

      # Every release carries its own installers, fixed to its own version, and they are covered by the same checksums.
      - name: Attach installers pinned to this release
        working-directory: cli
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          for f in install.sh install.ps1; do sed "s/__NAH_PINNED_VERSION__/$VERSION/" "$f" > "dist/$f"; done
          grep -q "^PINNED=\"$VERSION\"" dist/install.sh || { echo "::error::install.sh was not pinned"; exit 1; }
          grep -q "^\$Pinned = '$VERSION'" dist/install.ps1 || { echo "::error::install.ps1 was not pinned"; exit 1; }
          (cd dist && sha256sum *.tar.gz *.zip install.sh install.ps1 > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: nah-dist
          path: cli/dist/*
          if-no-files-found: error

  # The archives are built on Linux; run the ones a runner can execute, on the system they are for.
  verify:
    name: verify (${{ matrix.name }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64,   os: ubuntu-latest,    file: linux_amd64.tar.gz }
          - { name: linux-arm64,   os: ubuntu-24.04-arm, file: linux_arm64.tar.gz }
          - { name: macos-arm64,   os: macos-latest,     file: darwin_arm64.tar.gz }
          - { name: windows-amd64, os: windows-latest,   file: windows_amd64.zip }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: cli/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: nah-dist
          path: dist
      - name: Check the checksum
        working-directory: dist
        run: |
          f="nah_${{ needs.build.outputs.version }}_${{ matrix.file }}"
          expected="$(grep " $f\$" SHA256SUMS | cut -d' ' -f1)"
          if command -v sha256sum >/dev/null; then actual="$(sha256sum "$f" | cut -d' ' -f1)"; else actual="$(shasum -a 256 "$f" | cut -d' ' -f1)"; fi
          [ -n "$expected" ] && [ "$expected" = "$actual" ] || { echo "::error::checksum mismatch for $f"; exit 1; }
      - name: Unpack and run it
        working-directory: dist
        run: |
          f="nah_${{ needs.build.outputs.version }}_${{ matrix.file }}"
          case "$f" in
            *.zip) python -m zipfile -e "$f" . ;;
            *)     tar -xzf "$f" ;;
          esac
          bin="$(find . -maxdepth 2 -name 'nah' -o -maxdepth 2 -name 'nah.exe' | head -1)"
          chmod +x "$bin" 2>/dev/null || true
          out="$("$bin" version)"
          echo "$out"
          case "$out" in *"${{ needs.build.outputs.version }}"*) ;; *) echo "::error::the binary does not report version ${{ needs.build.outputs.version }}"; exit 1 ;; esac
          "$bin" --help > /dev/null
      - name: Installers and update, on this system
        run: bash cli/scripts/test-installers.sh dist "${{ needs.build.outputs.version }}"

  publish:
    name: publish the release
    needs: [build, verify]
    if: startsWith(github.ref, 'refs/tags/cli/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign the build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: nah-dist
          path: dist

      - name: Attest where these files came from
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

      - name: Write the release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          prev="$(git tag --list 'cli/v*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -1 || true)"
          {
            echo "## nah $VERSION"
            echo
            case "$VERSION" in *-*) echo "> **Pre-release.** Please try it and report what you find before the final version." ; echo ;; esac
            # hand-written highlights for this version (a suffix such as -rc.1 uses the notes of the version it leads to)
            notes=".github/release-notes/cli-${VERSION%%-*}.md"
            if [ -f "$notes" ]; then cat "$notes"; echo; fi
            echo "### Install"
            echo
            echo "**Linux and macOS**"
            echo
            echo '```sh'
            echo "curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.sh | sh"
            echo '```'
            echo
            echo "**Windows (PowerShell)**"
            echo
            echo '```powershell'
            echo "irm https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.ps1 | iex"
            echo '```'
            echo
            echo "Both install exactly this version, check it against \`SHA256SUMS\`, and need no administrator rights. Later, run \`nah update\`."
            echo
            echo "Or download the archive for your system below, check it against \`SHA256SUMS\`, unpack it, and put \`nah\` somewhere on your PATH."
            echo
            echo "| System | File |"
            echo "|---|---|"
            echo "| Linux (Intel/AMD, ARM) | \`nah_${VERSION}_linux_amd64.tar.gz\`, \`nah_${VERSION}_linux_arm64.tar.gz\` |"
            echo "| macOS (Intel, Apple Silicon) | \`nah_${VERSION}_darwin_amd64.tar.gz\`, \`nah_${VERSION}_darwin_arm64.tar.gz\` |"
            echo "| Windows (Intel/AMD, ARM) | \`nah_${VERSION}_windows_amd64.zip\`, \`nah_${VERSION}_windows_arm64.zip\` |"
            echo
            echo "Every file is covered by a signed build attestation: \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
            echo
            echo "### Changes"
            echo
            # the first release has no previous tag to compare with: the highlights above are its changelog
            log=""
            if [ -n "$prev" ]; then log="$(git log --no-merges --pretty='- %s (%h)' "$prev..$GITHUB_SHA" -- cli)"; fi
            if [ -n "$log" ]; then echo "$log"; else echo "First release: everything above is new."; fi
          } > notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "nah $VERSION" --notes-file notes.md $flags

  # The last word: install from the release that was just published, exactly as its notes tell people to, on each system.
  published:
    name: installed from the release (${{ matrix.name }})
    needs: [build, publish]
    if: startsWith(github.ref, 'refs/tags/cli/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64,   os: ubuntu-latest }
          - { name: linux-arm64,   os: ubuntu-24.04-arm }
          - { name: macos-arm64,   os: macos-latest }
          - { name: windows-amd64, os: windows-latest }
    steps:
      - name: Install with the one-line command (Linux, macOS)
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }} # only to raise the API rate limit for `nah update --check`
        run: |
          export NAH_INSTALL_DIR="$RUNNER_TEMP/bin"
          curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.sh" | sh
          out="$("$NAH_INSTALL_DIR/nah" version)"; echo "$out"
          case "$out" in *"nah $VERSION "*) ;; *) echo "::error::installed '$out', expected $VERSION"; exit 1 ;; esac
          "$NAH_INSTALL_DIR/nah" update --check
      - name: Install with the one-line command (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $env:NAH_INSTALL_DIR = "$env:RUNNER_TEMP\nah"
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/install.ps1"
          for ($i = 1; $i -le 6; $i++) {
            try { $script = Invoke-RestMethod -UseBasicParsing -Uri $url; break }
            catch { if ($i -eq 6) { throw }; Start-Sleep -Seconds 5 }
          }
          Invoke-Expression $script
          $out = & "$env:NAH_INSTALL_DIR\nah.exe" version
          Write-Host $out
          if ($out -notlike "*nah $env:VERSION *") { throw "installed '$out', expected $env:VERSION" }
          & "$env:NAH_INSTALL_DIR\nah.exe" update --check
