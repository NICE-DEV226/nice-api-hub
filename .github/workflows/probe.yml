name: Provider probe
# Upstream sites change without notice. This runs every provider against the real service each day
# and fails (=> notification) as soon as one stops working. Also runnable by hand.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --workspace=@nice-api-hub/gateway
      - run: pip install --user -U yt-dlp && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: npm run probe -w @nice-api-hub/gateway
