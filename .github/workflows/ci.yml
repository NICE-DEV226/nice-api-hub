name: CI
on:
  push:
    branches: [main, "v2/**"]
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: nah, POSTGRES_PASSWORD: nah, POSTGRES_DB: nah_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nah" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://nah:nah@127.0.0.1:5432/nah_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --workspace=@nice-api-hub/gateway
      - run: ffmpeg -version | head -1   # preinstalled on the runner; the download tests use it
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: make dist
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/gateway/Dockerfile -t nice-api-hub:ci .
      - run: docker run --rm --entrypoint sh nice-api-hub:ci -c 'yt-dlp --version && ffmpeg -version | head -1 && node -v'
